<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SharpJS Sounding Viewer</title>
    <meta name="description" content="SharpJS: an interactive Skew-T and hodograph sounding analysis tool that runs in your browser." />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000'/%3E%3Cpath d='M6 28 L26 4' stroke='%23ff4d4d' stroke-width='3'/%3E%3Cpath d='M4 28 L20 6' stroke='%2300d26a' stroke-width='3'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <h1>SharpJS</h1>
        <span class="version" id="version"></span>
      </div>
      <label class="sample-picker">
        <span>Sample</span>
        <select id="samples"><option value="">Choose a sample sounding…</option></select>
      </label>
      <nav class="links">
        <a href="https://diamondflight.github.io/SharpJS/docs.html">Docs</a>
        <a href="https://github.com/DiamondFlight/sharpjs#readme" target="_blank" rel="noopener">Read Me</a>
        <a href="https://github.com/DiamondFlight/sharpjs" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </header>
    <main id="chart" class="app-main"></main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
